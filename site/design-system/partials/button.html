<!-- Button. variant: primary (default) · secondary · inverse · on-color.
     size: lg (default) · sm. Modifier: pv-btn--block for a full-width button.
     Use <a> when it navigates and <button> when it acts.

     The specimen labels are the site's real CTA ladder, because a specimen is
     where the next page copies its label from: download-and-register as the
     action, a conversation as the alternative. The secondary slot previously
     read `Start a free trial → #trial`, but we offer no managed service to
     start a trial on, in any tense. -->
<a class="pv-btn" href="#contact">Book a demo</a>
<a class="pv-btn pv-btn--secondary" href="/register">Get a free licence</a>
<a class="pv-btn pv-btn--inverse" href="#download">Download</a>
<a class="pv-btn pv-btn--on-color" href="#docs">Read the docs</a>
<a class="pv-btn pv-btn--sm" href="#contact">Book a demo</a>
<a class="pv-btn pv-btn--sm pv-btn--secondary" href="/register">Get a free licence</a>
<button class="pv-btn pv-btn--block" type="submit">Book a demo</button>
