<!-- ComparisonTable. Them against us. Put data-highlight on the Provisa
     column's cells, header included. Scrolls horizontally under 640px rather
     than reflowing, because a comparison read down one column is not a
     comparison. -->
<div class="pv-table">
  <table>
    <caption class="pv-sr">Starburst compared with Provisa</caption>
    <thead>
      <tr>
        <td></td>
        <th scope="col">Starburst</th>
        <th scope="col" data-highlight>Provisa</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">What it is</th>
        <td>A query engine and lakehouse platform</td>
        <td data-highlight>A semantic and governance layer over an engine you choose</td>
      </tr>
      <tr>
        <th scope="row">Query languages</th>
        <td>SQL</td>
        <td data-highlight>SQL, GraphQL and Cypher over one model</td>
      </tr>
      <tr>
        <th scope="row">The engine</th>
        <td>Is the product</td>
        <td data-highlight>Is a swappable component</td>
      </tr>
    </tbody>
  </table>
</div>
