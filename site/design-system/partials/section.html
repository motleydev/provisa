<!-- Section. The band wrapper every page is built from: a full-bleed
     background and a container that carries the gutter and the section
     rhythm. Bands: plain (the page colour) · pv-section--band (white, ruled
     top and bottom) · pv-section--brand (cobalt) · pv-section--brand-alt
     (forest) · pv-section--inverse (ink). pv-section--tight for the shorter
     rhythm. -->
<section class="pv-section">
  <div class="pv-container">
    <h2 class="pv-h pv-h--section">A plain section</h2>
  </div>
</section>

<section class="pv-section pv-section--band">
  <div class="pv-container">
    <h2 class="pv-h pv-h--section">A white band</h2>
  </div>
</section>

<!-- The rail grid: a label-and-figure rail beside a wide body column. -->
<section class="pv-section">
  <div class="pv-container">
    <div class="pv-rail">
      <div class="pv-rail__rail">
        <div class="pv-seclabel">
          <span class="pv-seclabel__num">01</span>
          <span class="pv-seclabel__text">The problem</span>
        </div>
        <div class="pv-fig" role="img" aria-label="Figure 1: the layer between sources and consumers">
          <span class="pv-fig__label">FIG. 01</span>
          <i class="pv-fig__s pv-fig__s--sq pv-fig__s--run" style="--l:10;--t:8;--w:34"></i>
          <i class="pv-fig__s" style="--l:27;--t:21;--w:2;--h:48"></i>
        </div>
      </div>
      <div class="pv-rail__body">
        <h2 class="pv-h pv-h--section">The engine is a component</h2>
        <p class="pv-p">Body copy sits in the wide column, capped at the
          measure rather than at the container.</p>
      </div>
    </div>
  </div>
</section>
