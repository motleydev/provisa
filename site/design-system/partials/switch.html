<!-- Switch. A button with role=switch, so the state is the control's and not
     a div's. The track keeps the kit's pill — the one radius in a square
     system — and gains a 1px edge, without which the off state is 1.9:1
     against paper. -->
<button class="pv-switch" type="button" role="switch" aria-checked="true">
  <span>Row rules</span>
  <span class="pv-switch__state">on</span>
  <span class="pv-switch__track" aria-hidden="true"></span>
</button>

<button class="pv-switch" type="button" role="switch" aria-checked="false">
  <span>Column masking</span>
  <span class="pv-switch__state">off</span>
  <span class="pv-switch__track" aria-hidden="true"></span>
</button>
