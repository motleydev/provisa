<!-- ToggleButtons. A single-choice group. aria-pressed rather than a radio
     group, because these filter a view rather than submit a value. -->
<div class="pv-toggle" role="group" aria-label="Deployment">
  <button type="button" aria-pressed="true">Embedded</button>
  <button type="button" aria-pressed="false">Self-hosted</button>
  <button type="button" aria-pressed="false">Private cloud</button>
  <button type="button" aria-pressed="false">Air-gapped</button>
</div>
