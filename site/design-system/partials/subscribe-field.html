<!-- SubscribeField. One ruled box holding an input and an ink button. -->
<form class="pv-subscribe" method="post" action="/api/subscribe">
  <label class="pv-sr" for="s-email">Work email</label>
  <input id="s-email" name="email" type="email" autocomplete="email" placeholder="Work email" required>
  <button type="submit">Subscribe</button>
</form>
