<!-- ContactBand. The page-closing band: a call to action beside the demo
     form. Tones: forest (default) and pv-contact--inverse (ink). -->
<section class="pv-contact" id="contact">
  <div class="pv-contact__inner pv-container">
    <div class="pv-contact__copy">
      <div class="pv-bars" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2 class="pv-h pv-h--cta">Try it on your data</h2>
      <p class="pv-contact__sub">One binary, one config file, and a database
        you already have.</p>
      <div class="pv-contact__links">
        <a class="pv-link pv-link--inverse" href="https://cloud.provisa.dev">Start a free trial</a>
        <a class="pv-link pv-link--inverse" href="#">Try it on your data</a>
        <a class="pv-link pv-link--inverse" href="#">Download</a>
      </div>
    </div>
    <form class="pv-form" method="post" action="/api/demo">
      <h3 class="pv-form__title">Book a demo</h3>
      <div class="pv-form__grid">
        <label class="pv-sr" for="c-name">Full name</label>
        <input class="pv-input" id="c-name" name="name" autocomplete="name" placeholder="Full name" required>
        <label class="pv-sr" for="c-email">Work email</label>
        <input class="pv-input" id="c-email" name="email" type="email" autocomplete="email" placeholder="Work email" required>
      </div>
      <button class="pv-btn pv-btn--block" type="submit">Book a demo</button>
    </form>
  </div>
</section>
