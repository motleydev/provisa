<!-- Input. Always labelled: pv-field__label visible, or pv-sr when the
     placeholder carries the name and the design has no room for a label. -->
<div class="pv-field">
  <label class="pv-field__label" for="f-email">Work email</label>
  <input class="pv-input" id="f-email" name="email" type="email" autocomplete="email"
         placeholder="you@company.com" required>
</div>
