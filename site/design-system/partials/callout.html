<!-- Callout. A mono label beside a line of copy, with a coloured edge.
     Tones: vermilion (default) and pv-callout--get for forest, which is what a
     pair of callouts needs when one states what is uniform and the other what
     is not.
     Variants: paper (default) and pv-callout--inverse on a light page.
     The label is optional — leave it off rather than invent one. -->
<div class="pv-callout">
  <span class="pv-callout__label">PLAN OUT</span>
  <span class="pv-callout__body">Non-production use is free forever, for any
    size organization.</span>
</div>

<div class="pv-callout pv-callout--get">
  <span class="pv-callout__label">UNIFORM</span>
  <span class="pv-callout__body">Row filters, column masking, domain reach and
    the join guard do not vary by protocol.</span>
</div>

<div class="pv-callout pv-callout--inverse">
  <span class="pv-callout__label">NOTE</span>
  <span class="pv-callout__body">The engine stays yours: Trino, DuckDB,
    ClickHouse, Postgres, Snowflake, Databricks or BigQuery.</span>
</div>
