<!-- @dsCard group="Colors" viewport="700x170" subtitle="Ink and paper are constant; white bands alternate" name="Ink, paper & bands" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.m{font-family:var(--font-mono);font-size:11px}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--ink);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#16181d ink</div><div class="m" style="color:var(--gray-600)">--ink</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--paper);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#f8f6f1 paper</div><div class="m" style="color:var(--gray-600)">--paper</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--white);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#ffffff band</div><div class="m" style="color:var(--gray-600)">--white</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--sand);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#ece9e1 chip/code</div><div class="m" style="color:var(--gray-600)">--sand</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--rule);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#dcd8ce hairline</div><div class="m" style="color:var(--gray-600)">--rule</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--rule-input);border:1px solid var(--rule)"></div><div class="m" style="color:var(--ink)">#cfcabe input</div><div class="m" style="color:var(--gray-600)">--rule-input</div></div></div></body></html>
