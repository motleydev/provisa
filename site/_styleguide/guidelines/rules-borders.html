<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.m{font-family:var(--font-mono);font-size:11px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px"><div style="display:flex;flex-direction:column;gap:10px"><div style="height:64px;border-top:1px solid var(--rule);background-color:#fff"></div><span class="m" style="color:var(--gray-600)">1px hairline</span></div><div style="display:flex;flex-direction:column;gap:10px"><div style="height:64px;border-top:1px solid var(--ink);background-color:#fff"></div><span class="m" style="color:var(--gray-600)">1px ink rule</span></div><div style="display:flex;flex-direction:column;gap:10px"><div style="height:64px;border-top:4px solid var(--cobalt);background-color:#fff"></div><span class="m" style="color:var(--gray-600)">4px top-rule card</span></div><div style="display:flex;flex-direction:column;gap:10px"><div style="height:64px;border-left:6px solid var(--vermilion);background:var(--vermilion-tint);background-color:"></div><span class="m" style="color:var(--gray-600)">6px accent edge</span></div></div><p style="margin-top:14px;font-size:13px;color:var(--gray-600)">radius 0 · no shadows · the only rounded things are the role switch and the source-grid dots.</p></body></html>
