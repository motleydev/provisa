name: Deploy Site

# Builds the MkDocs docs into site/docs and deploys them, with the marketing
# landing page, to Cloudflare Pages. exclude_docs in mkdocs.yml keeps
# internal-only pages (requirements traceability, GTM/competitor, private
# multi-tenant/SaaS) out of the published site.
#
# Which Pages project it deploys to is per-repository: the repository variable
# CLOUDFLARE_PAGES_PROJECT, passed as --project-name. wrangler resolves the
# project as `--project-name ?? config.name`, so passing it overrides
# site/wrangler.jsonc's `name` (provisa-dev, bound to provisa.dev) and a fork
# publishes to its own project rather than over the upstream production site.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.*.md
      - docs/**
      - mkdocs.yml
      - scripts/gen_docs_index.py
      - site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ./.github/actions/docs-site-deps

      - name: Build docs into site/docs
        run: |
          python scripts/gen_docs_index.py
          mkdocs build --strict -d site/docs

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # Required, with no default on purpose: falling back to wrangler.jsonc's
          # `name` would publish this repository's main over provisa.dev.
          if [[ -z "$PAGES_PROJECT" ]]; then
            echo "::error::Repository variable CLOUDFLARE_PAGES_PROJECT is unset. Set it to the Cloudflare Pages project this repository publishes to (upstream: provisa-dev, bound to provisa.dev). A fork must name its own project, created with 'wrangler pages project create <name> --production-branch main'."
            exit 1
          fi
          npx --yes wrangler pages deploy --project-name "$PAGES_PROJECT" --branch=main --commit-dirty=true
