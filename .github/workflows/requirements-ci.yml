name: Requirements CI

# Validates requirements.yaml schema, checks generated artifacts for drift,
# runs pytest-bdd scenarios, and enforces coverage for MUST behavioral requirements.

# The website starts no run: nothing here reads site/. Markdown is filtered out except the two
# files these generators write -- docs/arch/requirements.md and docs/features.md -- because a hand
# edit to one of those IS the drift this gate reports, while a change to any other markdown file
# cannot fail it. The third generated artifact (tests/features/*.feature) and the two sources of
# truth (docs/arch/requirements.yaml, docs/arch/features.yaml) are not markdown and stay in by `**`.
# tests/unit/test_ci_pr_paths.py holds this.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!site/**"
      - "!**/*.md"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/site-*.yml"
      - "!scripts/gen-site-*.mjs"
      - "docs/arch/requirements.md"
      - "docs/features.md"
  pull_request:
    # Written out rather than aliased: `on:` is the one block GitHub reads before it runs
    # anything, and an alias it refused there would stop the workflow on every event.
    paths:
      - "**"
      - "!site/**"
      - "!**/*.md"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/site-*.yml"
      - "!scripts/gen-site-*.mjs"
      - "docs/arch/requirements.md"
      - "docs/features.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate requirements.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Schema validation
        run: uv run python scripts/validate_requirements.py

      - name: Coverage check (MUST behavioral completeness)
        run: uv run python scripts/validate_requirements.py --coverage-check

  # No `needs: validate`. The two jobs read the same source but answer different questions, and
  # chaining them meant one bad `feature:` tag on one requirement took the drift check offline for
  # every branch at once: 25 requirements were appended to the generated `requirements.md` over
  # weeks, invisible to the schema check (which reads the YAML) and to this job (which never ran).
  # Invalid YAML now fails both jobs rather than reporting one and skipping the other.
  drift:
    name: Check generated artifacts for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Check requirements.md is up to date
        run: uv run python scripts/gen_requirements_md.py --check

      - name: Check features.md is up to date
        run: uv run python scripts/gen_features_doc.py --check

      - name: Check .feature files are up to date
        run: uv run python scripts/gen_features.py --check

  # There is no BDD job here. One used to run `pytest tests/features/ -m bdd | tail -20`: that
  # directory holds only .feature files, pytest collected nothing ("no tests ran"), and the pipe
  # to tail made its "nothing collected" exit a success -- a job that could only be green.
  # The scenarios are bound and run from tests/steps/steps_*.py, which need the container stack:
  # they run in the integration suite's lanes (scripts/ci/run_lane.py, _SUITE), each by its
  # markers. That every .feature file is bound by a step module is checked without services by
  # tests/unit/test_features_are_bound.py, in the unit workflow.
