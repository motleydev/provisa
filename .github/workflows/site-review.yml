name: Site Review Gate

# The browserless half of the site's own checkers, run on every pull request that
# touches site/. Until this workflow they ran only when a person remembered to type
# `node site/verify-claims.mjs`, which is how /why/one-model shipped "85+", "six
# layers" and "No invalid join ever runs on your data" past a green verify-home.mjs
# (PRO-27): the checker existed, nothing ran it.
#
# Everything here is node builtins or the Python standard library over the bytes on
# disk — site/ has no build step, so the served bytes are the checked bytes. No npm
# ci, no pip install, no browser, no server, no secrets. The browser half
# (verify-ui.mjs and the verify-page-*.mjs family) needs Playwright and a served
# site/ and is deliberately not in this job; it belongs in a workflow that can pay
# for a Chromium download.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - site/**
      - .github/workflows/site-review.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: site-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    name: struck claims + design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The checkers are discovered rather than listed. A hand-written list has to
      # name a fixed set of files, and the site pages arrive over a stack of PRs that
      # each add their own checker — so any one list is wrong for every tree but the
      # one it was written against: it names a checker a branch does not have yet, or
      # misses one a branch already has. Discovery is also the stronger form of the
      # PRO-27 guard this job exists for. The old shape ran a fixed list and then
      # checked separately that no checker had been left off it; finding them means a
      # new checker is gated the moment it lands, with nothing to keep in step.
      #
      # Each checker prints one PASS/ok line per assertion and exits non-zero on its
      # first failure, so the log names the check and its numbers. Every checker runs
      # even after one fails, so a red run reports all of them, not just the first.
      #
      # A checker that imports playwright is the browser half — it needs Chromium and
      # a served site/ — and is skipped here by that import. Page checkers come in
      # both node and Python; the glob is on the check-/verify- name rather than an
      # extension so a checker in a third language cannot hide, and the interpreter
      # is chosen per file.
      # `shell: bash` rather than the implicit default: GitHub runs a named bash with
      # `-eo pipefail`, where the default is `-e` alone. The `find ... | sort` that feeds
      # the loop is a pipeline, so without pipefail a failing `find` would be reported as
      # `sort`'s success and the job would pass having run no checkers at all — the same
      # shape as the BDD job that piped pytest into `tail` and was green for as long as it
      # existed. tests/unit/test_ci_suite_queue.py enforces this repo-wide.
      - name: Every browserless checker under site/
        shell: bash
        run: |
          failed=""
          found=0
          while IFS= read -r f; do
            if grep -q "playwright" "$f"; then
              echo "skip  $f (browser half — needs Playwright and a served site/)"
              continue
            fi
            found=$((found + 1))
            case "$f" in
              *.py) runner=python3 ;;
              *)    runner=node ;;
            esac
            # The condition of an `if` is exempt from the `-e` this shell runs under,
            # so a failing checker records itself here instead of ending the step and
            # hiding every checker after it.
            echo "::group::$f"
            if "$runner" "$f"; then
              echo "::endgroup::"
              echo "ok    $f"
            else
              echo "::endgroup::"
              echo "FAIL  $f"
              failed="$failed $f"
            fi
          done < <(find site \( -name 'check-*' -o -name 'verify-*' \) -type f | sort)
          if [ -n "$failed" ]; then
            echo "Failing checkers:$failed"
            exit 1
          fi
          # Zero is reported rather than assumed green: before the design-system kit
          # lands there is genuinely nothing browserless under site/ to run, and a
          # silent pass would read the same as a pass that checked something.
          echo "ok    $found browserless checker(s) under site/ passed"
