name: UI Unit Tests

# provisa-ui's type check and its vitest suite: no server, no containers, no secrets. Until this
# workflow they ran only on a maintainer's machine, so a type error or a failing component test
# reached main unseen by CI (the Playwright workflows are release-branch and on demand).

# Filtered as the container suite is (integration-suite.yml): the type check, the vitest suite and
# the graph renderer read provisa-ui/ alone, so a change of only the website, the documentation or
# a markdown file cannot fail them -- and a gate that cannot fail is red only for something the
# change did not touch. The two generator checks that DID read site/ were the reason this workflow
# went red on every pull request (a site page whose marker comments a rebuild dropped); they are
# the website's own gate now and live in site-generators.yml, which does run on a site change.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!site/**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/site-*.yml"
      - "!scripts/gen-site-*.mjs"
  pull_request:
    # Written out rather than aliased: `on:` is the one block GitHub reads before it runs
    # anything, and an alias it refused there would stop the workflow on every event.
    paths:
      - "**"
      - "!site/**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/site-*.yml"
      - "!scripts/gen-site-*.mjs"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: ui-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: tsc + vitest
    runs-on: ubuntu-latest
    # One job: the type check and the tests share one install and one runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: provisa-ui
    steps:
      - uses: actions/checkout@v4

      # Node and the install, as the Playwright workflows do them.
      - name: Set up the UI toolchain
        uses: ./.github/actions/setup-ui
        with:
          graph-render: "true"

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

      # render_graph's renderer (REQ-1990): its own package, tested by node --test against its
      # built bundle -- each layout on each theme, as the MCP server runs it.
      - name: Graph renderer -- type check, build, test
        working-directory: provisa-ui/graph-render
        run: |
          npm run typecheck
          npm run build
          npm test
